version: '1.0'
project:
  service_name: logistics-delivery-service
  repository: ahmedharib/logistics-api
  default_branch: main
  read_only_source: true
observability:
  provider: direct
  watchdog_interval_seconds: 45
database:
  engine: postgres
  read_only_connection_env: DATABASE_RO_URL
  require_read_only_mode: true
  schema_path: auto
  telemetry_source: auto
  migration_output_dir: migrations
  max_healing_retries: 3
  sla_thresholds:
    p99_latency_ms: 500.0
    max_cpu_percent: 75.0
    min_sandbox_speedup_percent: 85.0
upstream_apis:
- name: global_routing_carrier_api
  baseline_spec: contracts/routing_v1.json
  spec_url: contracts/routing_v2.json
  test_target: tests/test_carrier_routing.py
sandbox:
  provider: modal
  app_name: aegis-sre
  timeout_seconds: 90
